name: PR rules

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read

# Runs on label and description changes too. No concurrency cancelling: it takes ~10s,
# and a cancelled run shows up as a confusing cancelled check on the PR.

jobs:
  rules:
    name: PR rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git fetch --no-tags origin "$PR_BASE:refs/remotes/origin/$PR_BASE"
        env:
          PR_BASE: ${{ github.event.pull_request.base.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - name: Test the PR rules script
        run: bun test ./.github/scripts
      - name: Run PR rules
        run: node .github/scripts/pr-check.ts
        env:
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
